packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.13'
  - '@better-auth/drizzle-adapter@1.7.13'
  - '@better-auth/expo@1.7.13'
  - '@better-auth/kysely-adapter@1.7.13'
  - '@better-auth/memory-adapter@1.7.13'
  - '@better-auth/mongo-adapter@1.7.13'
  - '@better-auth/prisma-adapter@1.7.13'
  - '@better-auth/telemetry@1.7.13'
  - better-auth@1.7.13
  - hono@4.13.14
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
# One React for web, editor and the Expo app (Expo SDK 58 pins 19.3.0); two copies break hooks in the editor DOM component.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  # GHSA-86w9-cpqp-85rv: upgrade Expo CLI's signature-verification dependency.
  'node-forge@<1.4.1': 1.4.2
auditConfig:
  ignoreGhsas:
    # Expo CLI 58.1.x requires Zod 3; the fix requires Zod >=4.6.6.
    # All affected paths end in @expo/cli>zod. Application Zod is pinned to 4.6.7.
    # Remove when Expo CLI supports patched Zod. See docs/OPERATIONS.md.
    - GHSA-mrhx-c7xc-m3w5
