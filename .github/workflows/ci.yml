name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/server/.dev.vars.example apps/server/.dev.vars
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r --filter=!mobile --filter=!desktop test # desktop runs in its own job (needs GTK/WebKit)
      - run: pnpm --filter web build
      - run: pnpm audit --prod --audit-level high
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux)
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/server/.dev.vars.example apps/server/.dev.vars
      - run: pnpm --filter server exec wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/state
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
