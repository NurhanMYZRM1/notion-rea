# Manual: copies the Google OAuth repository secrets onto the deployed Workers, then checks /api/providers.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
name: Set Google OAuth secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Workers to update
        type: choice
        options: [both, staging, production]
        default: both

permissions: {}

jobs:
  put:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 636b468ba739e81c9a875f1c56f5d7bb
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing"; exit 1; }
          done
          workers=""
          [ "$TARGET" != production ] && workers="$workers workspace-staging"
          [ "$TARGET" != staging ] && workers="$workers workspace"
          for w in $workers; do
            printf '%s' "$GOOGLE_CLIENT_ID" | npx -y wrangler@4.152.0 secret put GOOGLE_CLIENT_ID --name "$w"
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx -y wrangler@4.152.0 secret put GOOGLE_CLIENT_SECRET --name "$w"
          done
          echo "WORKERS=$workers" >> "$GITHUB_ENV"
      - name: Check Google sign-in is enabled
        run: |
          sleep 10
          for w in $WORKERS; do
            body=$(curl -fsS "https://$w.paragonxplays.workers.dev/api/providers")
            echo "$w: $body"
            echo "$body" | grep -q '"google":true' || { echo "::error::$w does not report Google enabled"; exit 1; }
          done
